name: Test

on: [ pull_request, push ]

jobs:
  duplicate_check:
    name: Skip Duplicate Actions
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          concurrent_skipping: 'same_content_newer'

  build:
    name: Build
    needs: [ duplicate_check ]
    if: needs.duplicate_check.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Restore Gradle Cache
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.gradle
            ~/gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('build.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ hashFiles('build.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
            ${{ runner.os }}-gradle-

      - name: Grant Permissions to Gradlew
        run: chmod +x ./gradlew

      - name: Generate Resources
        run: ./gradlew runData

      - name: Cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.gradle
            ~/gradle
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Build
        run: ./gradlew build

      - name: Capture Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: brewersdelight
          path: build/libs/
          if-no-files-found: error
          retention-days: 7