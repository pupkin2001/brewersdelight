name: Build

on:
  push:
    tags:
      - 'v*'
    branches:
      - '1.*.x'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Restore Gradle Cache
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.gradle
            ~/gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('build.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ hashFiles('build.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
            ${{ runner.os }}-gradle-

      - name: Grant Permissions to Gradlew
        run: chmod +x ./gradlew

      - name: Generate Resources
        run: ./gradlew runData

      - name: Cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.gradle
            ~/gradle
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Build
        run: ./gradlew build

      - name: Capture build artifact
        uses: actions/upload-artifact@v7
        with:
          name: brewersdelight
          path: build/libs/
          if-no-files-found: error
          retention-days: 28

  release:
    name: Release
    if: github.ref == 'refs/heads/1.*.x'
    needs: [ build ]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      MC_VERSION: 1.20.1

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: brewinandchewin
          path: ./libs

      - name: Get Version
        id: version
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            let ref = '${{ github.ref }}';
            return ref.startsWith('refs/tags/v') ? ref.replace('refs/tags/v', '') : 'development';

      - name: Get File Name
        run: |
          FILE_NAME=$(find build/libs/ -name "brewersdelight-${{ env.MC_VERSION }}-*.jar")
          echo "FILE_NAME=${FILE_NAME}" >> $GITHUB_ENV

      - name: Create GitHub Release Draft
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: "Release ${{ github.ref_name }}"
          body_path: RELEASE.md
          draft: true
          prerelease: false

      - name: Upload Release Asset
        if: steps.create_release.outputs.upload_url != ''
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ env.FILE_NAME }}
          asset_name: $(basename "${{ env.FILE_NAME }}")
          asset_content_type: application/java-archive
