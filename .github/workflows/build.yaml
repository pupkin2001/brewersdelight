name: Build

on:
  push:

jobs:
  build-dependency:
    name: Build Dependency
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Dependency Repository
        uses: actions/checkout@v4
        with:
          repository: j-cob44/BrewinAndChewin

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Dependency Gradle
        id: cache-dep
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle
            ~/gradle
          key: ${{ runner.os }}-dep-gradle-${{ hashFiles('build.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-dep-gradle-${{ hashFiles('build.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
            ${{ runner.os }}-dep-gradle-

      - name: Grant Permissions to Gradlew
        run: chmod +x ./gradlew

      - name: Initialize Dependency Gradlew
        if: steps.cache-dep.outputs.cache-hit != 'true'
        run: ./gradlew

      - name: Build Dependency
        run: ./gradlew build

      - name: Capture Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: brewinandchewin
          path: build/libs/
          if-no-files-found: error
          retention-days: 5

  cache:
    name: Cache
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle
            ~/gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('build.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ hashFiles('build.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
            ${{ runner.os }}-gradle-

      - name: Grant Permissions to Gradlew
        if: steps.cache.outputs.cache-hit != 'true'
        run: chmod +x ./gradlew

      - name: Initialize Gradlew
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./gradlew

  build:
    name: Build
    if: github.ref_type != 'tag'
    needs: [ build-dependency, cache ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Restore Gradle Cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle
            ~/gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('build.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
          fail-on-cache-miss: true

      - name: Download Dependency Artifact
        uses: actions/download-artifact@v4
        with:
          name: brewinandchewin
          path: ./libs

      - name: Grant Permissions to Gradlew
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build

      - name: Capture build artifact
        uses: actions/upload-artifact@v4
        with:
          name: brewersdelight
          path: build/libs/
          if-no-files-found: error
          retention-days: 5
