name: Build

on:
  push:

jobs:
  build-dependency:
    name: Build Dependency
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Dependency Repository
        uses: actions/checkout@v4
        with:
          repository: j-cob44/BrewinAndChewin

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Dependency Gradle
        id: cache-dep
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle
            ~/gradle
          key: ${{ runner.os }}-dep-gradle-${{ hashFiles('build.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-dep-gradle-${{ hashFiles('build.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
            ${{ runner.os }}-dep-gradle-

      - name: Grant Permissions to Gradlew
        run: chmod +x ./gradlew

      - name: Initialize Dependency Gradlew
        if: steps.cache-dep.outputs.cache-hit != 'true'
        run: ./gradlew

      - name: Build Dependency
        run: ./gradlew build

      - name: Capture Dependency Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: brewinandchewin
          path: build/libs/
          if-no-files-found: error
          retention-days: 5

  cache:
    name: Cache
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle
            ~/gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('build.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ hashFiles('build.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
            ${{ runner.os }}-gradle-

      - name: Grant Permissions to Gradlew
        if: steps.cache.outputs.cache-hit != 'true'
        run: chmod +x ./gradlew

      - name: Initialize Gradlew
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./gradlew

  build:
    name: Build
    needs: [ build-dependency, cache ]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Restore Gradle Cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle
            ~/gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('build.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ hashFiles('build.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
            ${{ runner.os }}-gradle-

      - name: Download Dependency Artifact
        uses: actions/download-artifact@v4
        with:
          name: brewinandchewin
          path: ./libs

      - name: Grant Permissions to Gradlew
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build

      - name: Capture build artifact
        uses: actions/upload-artifact@v4
        with:
          name: brewersdelight
          path: build/libs/
          if-no-files-found: error
          retention-days: 5

  release:
    name: Release
    if: github.ref_type != 'tag'
    needs: [ build ]
    permissions: write-all
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      MC_VERSION: 1.20.1

    steps:
      - name: Download Dependency Artifact
        uses: actions/download-artifact@v4
        with:
          name: brewersdelight
          path: ./build/libs

      - name: Get Version
        id: version
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            let ref = '${{ github.ref }}';
            return ref.startsWith('refs/tags/v') ? ref.replace('refs/tags/v', '') : 'development';

      - name: Get File Name
        run: |
          FILE_NAME=$(find build/libs/ -name "brewersdelight-${{ env.MC_VERSION }}-*.jar")
          echo "FILE_NAME=${FILE_NAME}" >> $GITHUB_ENV

      - name: Create GitHub Release
        id: create_release
        if: startsWith(github.ref, 'refs/heads/1.') && endsWith(github.ref, '.x')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: "Release ${{ github.ref_name }}"
          body_path: RELEASE.md
          draft: true
          prerelease: false

      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/heads/1.') && endsWith(github.ref, '.x') && steps.create_release.outputs.upload_url != ''
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ env.FILE_NAME }}
          asset_name: $(basename "${{ env.FILE_NAME }}")
          asset_content_type: application/java-archive
