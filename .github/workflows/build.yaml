name: Build

on:
  push:

jobs:
  build-dependency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dependency repository
        uses: actions/checkout@v4
        with:
          repository: j-cob44/BrewinAndChewin

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Dependency Gradle
        id: cache-dep
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle
            ~/gradle
          key: ${{ runner.os }}-gradle-dep-${{ hashFiles('build.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-dep-${{ hashFiles('build.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
            ${{ runner.os }}-gradle-dep-

      - name: Grant permissions to gradlew
        run: chmod +x ./gradlew

      - name: Initialize Dependency gradlew
        if: steps.cache-dep.outputs.cache-hit != 'true'
        run: ./gradlew

      - name: Build Dependency
        run: ./gradlew build

      - name: Checkout repository for cache key
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: Cache Built Dependency Artifact
        uses: actions/cache@v4
        with:
          path: build/libs/
          key: ${{ runner.os }}-gradle-dep-libs-${{ hashFiles('main-repo/build.gradle', 'main-repo/gradle/wrapper/gradle-wrapper.properties', 'main-repo/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-dep-libs-${{ hashFiles('main-repo/build.gradle', 'main-repo/gradle/wrapper/gradle-wrapper.properties', 'main-repo/gradle.properties') }}
            ${{ runner.os }}-gradle-dep-libs-

  build:
    if: github.ref_type != 'tag'
    needs: build-dependency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle
            ~/gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('build.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ hashFiles('build.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
            ${{ runner.os }}-gradle-

      - name: Restore Dependency Artifact from Cache
        id: restore-dep
        uses: actions/cache@v4
        with:
          path: ./libs
          key: ${{ runner.os }}-gradle-dep-${{ hashFiles('build.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
        continue-on-error: false

      - name: Grant permissions to gradlew
        run: chmod +x ./gradlew

      - name: Initialize gradlew
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./gradlew

      - name: Build
        run: ./gradlew build

      - name: Capture build artifact
        uses: actions/upload-artifact@v4
        with:
          name: brewersdelight
          path: build/libs/
          if-no-files-found: error
          retention-days: 5
